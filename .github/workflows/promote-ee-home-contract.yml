name: Promote Estonia homepage deep contract

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/promote_ee_home_contract.py'
      - '.github/workflows/promote-ee-home-contract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fail-closed homepage contract promotion
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/promote_ee_home_contract.py

      - name: Verify deep homepage markers
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'Estonia Property Intelligence API — Land, Buildings, Energy & Permits | PropData' index.html >/dev/null
          grep -F 'National cadastral land intelligence' index.html >/dev/null
          grep -F 'Official assessed land value' index.html >/dev/null
          grep -F 'Energy certificate history' index.html >/dev/null
          grep -F 'Permit and document history' index.html >/dev/null
          grep -F '>778K+</b><span data-en="Land-enriched cadastral units"' index.html >/dev/null
          echo 'ESTONIA HOMEPAGE DEEP CONTRACT VERIFY: PASS'

      - name: Commit promoted homepage contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No homepage promotion changes required.'
            exit 0
          fi
          git commit -m 'Promote Estonia homepage to deep property intelligence contract'
          git push origin HEAD:main
